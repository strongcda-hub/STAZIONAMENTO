<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AstroDSC Push-To Pro - Natural Starfield</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
        html, body {
            width: 100%; height: 100%;
            background-color: #000000 !important;
            color: #ff3333;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        #skyCanvas {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #000000 !important;
            z-index: 1;
            display: block;
        }

        #hud-top {
            position: absolute; top: 10px; left: 10px; right: 10px;
            z-index: 10;
            background: rgba(30, 0, 0, 0.90);
            border: 1.5px solid #00ff00; border-radius: 6px;
            padding: 6px 10px; font-size: 11px;
            display: flex; justify-content: space-between; align-items: center;
            color: #ff4444;
        }

        .hud-val { color: #ff6666; font-weight: bold; }

        #hud-bottom {
            position: absolute; bottom: 10px; left: 10px; right: 10px;
            z-index: 10;
            background: rgba(25, 0, 0, 0.95);
            border: 1.5px solid #00ff00; border-radius: 8px;
            padding: 8px;
        }

        .row-flex { display: flex; gap: 6px; align-items: center; }

        select, input[type="text"] {
            background: #200000 !important;
            color: #ff4444 !important;
            border: 1.5px solid #00ff00 !important;
            padding: 8px;
            border-radius: 4px;
            font-family: inherit; font-size: 11px;
            width: 100%; outline: none;
        }

        button {
            background: #2b0000;
            color: #ff6666;
            border: 1.5px solid #00ff00;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: inherit; font-weight: bold;
            font-size: 11px; cursor: pointer; white-space: nowrap;
        }

        button:active { background: #550000; color: #ffffff; }

        #zoom-controls {
            position: absolute; right: 15px; bottom: 120px;
            z-index: 10; display: flex; flex-direction: column; gap: 8px;
        }

        .zoom-btn {
            width: 40px; height: 40px; border-radius: 50%;
            font-size: 18px; padding: 0; display: flex;
            align-items: center; justify-content: center;
            background: rgba(40, 0, 0, 0.9); border: 2px solid #00ff00;
        }

        #advanced-menu {
            display: none; margin-top: 8px;
            border-top: 1px dashed #00ff00; padding-top: 8px;
            font-size: 11px;
        }

        .filter-btn-group { display: flex; gap: 4px; margin-top: 6px; }
        .filter-btn { flex: 1; padding: 6px; font-size: 10px; background: #200000; border: 1.5px solid #00ff00; color: #ff5555; }
        .filter-btn.active { background: #660000; color: #ffffff; border-color: #00ff00; }

        .moon-box {
            background: #1e0000;
            border: 1.5px solid #00ff00;
            padding: 6px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
            color: #ff4444;
        }

        #bingo-banner {
            position: absolute; top: 60px; left: 50%;
            transform: translateX(-50%); z-index: 20;
            background: rgba(40, 0, 0, 0.95); border: 2px solid #ff0000;
            color: #ff3333; padding: 10px 20px; border-radius: 8px;
            text-align: center; display: none; width: 85%; max-width: 300px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }
    </style>
</head>

        // Generatore Deterministico Pseudo-Casuale per Stelle di Campo Naturali (Nessuna griglia)
        function pseudoRandom(seed) {
            let x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        for (let i = 0; i < 280; i++) {
            let r = pseudoRandom(i * 1.3) * 24;
            let d = (pseudoRandom(i * 2.7) * 110) - 20;
            let m = 3.8 + pseudoRandom(i * 4.1) * 2.0;
            stars[`s_field_${i}`] = { ra: r, dec: d, mag: m, isField: true };
        }

        const constellationLines = [
            ["Dubhe", "Merak"], ["Merak", "Phecda"], ["Phecda", "Megrez"], ["Megrez", "Dubhe"],
            ["Megrez", "Alioth"], ["Alioth", "Mizar"], ["Mizar", "Alkaid"],
            ["Caph", "Shedar"], ["Shedar", "GammaCas"], ["GammaCas", "Ruchbah"], ["Ruchbah", "Segin"],

            ["Deneb", "Sadr"], ["Sadr", "Albireo"], ["Sadr", "Gienah"], ["Sadr", "Delta Cyg"],
            ["Altair", "Tarazed"], ["Altair", "Alshain"],
            ["Rutilicus", "Kornephoros"], ["Rutilicus", "Sarin"], ["Sarin", "Rasgethi"],

        let userLat = 45.05;
        let userLon = 9.69;
        let phoneAz = 0;
        let phoneAlt = 35;
        let fov = 70;
        let activeCategoryFilter = 'ALL';
        let selectedTarget = null;
        let canvas, ctx;

        function toggleMenu() {
            const m = document.getElementById("advanced-menu");
            m.style.display = (m.style.display === "block") ? "none" : "block";
        }

        function zoomIn() { fov = Math.max(15, fov - 10); }
        function zoomOut() { fov = Math.min(130, fov + 10); }

        function getLST() {
            const now = new Date();
            const year = now.getUTCFullYear();
            const month = now.getUTCMonth() + 1;
            const day = now.getUTCDate();
            const hour = now.getUTCHours() + now.getUTCMinutes() / 60.0 + now.getUTCSeconds() / 3600.0;

            let a = Math.floor((14 - month) / 12);
            let y = year + 4800 - a;
            let m = month + 12 * a - 3;
            let jd = day + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045 + (hour - 12) / 24.0;
            let d = jd - 2451545.0;
            let gmst = (280.46061837 + 360.98564736629 * d) % 360;
            if (gmst < 0) gmst += 360;
            return (gmst + userLon + 360) % 360;
        }

        function updateMoonInfo() {
            const now = new Date();
            const synodicMonth = 29.53058867;
            const knownNewMoon = new Date(2000, 0, 6, 18, 14);
            const daysSince = (now - knownNewMoon) / (1000 * 60 * 60 * 24);
            const cyclePhase = (daysSince % synodicMonth) / synodicMonth;
            const illumination = Math.round((1 - Math.cos(cyclePhase * 2 * Math.PI)) / 2 * 100);

            let phaseName = "";
            if (cyclePhase < 0.03 || cyclePhase > 0.97) phaseName = "Nuova";
            else if (cyclePhase < 0.22) phaseName = "Crescente";
            else if (cyclePhase < 0.28) phaseName = "Primo Quarto";
            else if (cyclePhase < 0.47) phaseName = "Gibbosa C.";
            else if (cyclePhase < 0.53) phaseName = "Piena";
            else if (cyclePhase < 0.72) phaseName = "Gibbosa Cal.";
            else if (cyclePhase < 0.78) phaseName = "Ultimo Quarto";
            else phaseName = "Calante";

            const moonObj = rawCatalog.find(o => o.id === "Luna");
            if (moonObj) {
                let meanLongitude = (218.316 + 13.176396 * daysSince) % 360;
                moonObj.ra = ((meanLongitude / 15) % 24 + 24) % 24;
                moonObj.dec = 5.14 * Math.sin(meanLongitude * Math.PI / 180);
            }

            const pElem = document.getElementById("moonPhaseName");
            if (pElem) pElem.textContent = phaseName;
            const iElem = document.getElementById("moonIllum");
            if (iElem) iElem.textContent = illumination;

            let riseHour = Math.floor((cyclePhase * 24 + 6) % 24);
            let setHour = Math.floor((riseHour + 12) % 24);
            const rElem = document.getElementById("moonRise");
            if (rElem) rElem.textContent = `${String(riseHour).padStart(2,'0')}:00`;
            const sElem = document.getElementById("moonSet");
            if (sElem) sElem.textContent = `${String(setHour).padStart(2,'0')}:00`;
        }

        function raDecToAltAz(raHours, decDeg, lstDeg) {
            const raDeg = raHours * 15;
            const haRad = ((lstDeg - raDeg + 360) % 360) * Math.PI / 180;
            const latRad = userLat * Math.PI / 180;
            const decRad = decDeg * Math.PI / 180;

            const sinAlt = Math.sin(decRad) * Math.sin(latRad) + Math.cos(decRad) * Math.cos(latRad) * Math.cos(haRad);
            const altRad = Math.asin(sinAlt);
            const altDeg = altRad * 180 / Math.PI;

            let cosAz = (Math.sin(decRad) - Math.sin(latRad) * Math.sin(altRad)) / (Math.cos(latRad) * Math.cos(altRad));
            cosAz = Math.max(-1, Math.min(1, cosAz));
            let azRad = Math.acos(cosAz);
            let azDeg = azRad * 180 / Math.PI;
            if (Math.sin(haRad) > 0) azDeg = 360 - azDeg;

            return { alt: altDeg, az: azDeg };
        }

        function drawClippedLine(p1, p2) {
            const margin = 10;
            const w = canvas.width;
            const h = canvas.height;

            if (p1.x < -margin && p2.x < -margin) return;
            if (p1.x > w + margin && p2.x > w + margin) return;
            if (p1.y < -margin && p2.y < -margin) return;
            if (p1.y > h + margin && p2.y > h + margin) return;

            let dx = p2.x - p1.x;
            let dy = p2.y - p1.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > canvas.width * 0.8) return;

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
        }

        function drawSky() {
            if (!canvas || !ctx) return;

            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const scale = canvas.height / fov;
            const lst = getLST();
            const now = Date.now();
            const isBlinkOn = Math.floor(now / 350) % 2 === 0;

            const pElem = document.getElementById("phoneCoords");
            if (pElem) pElem.textContent = `${phoneAlt.toFixed(0)}°/${phoneAz.toFixed(0)}°`;

            // 1. TERRENO E ORIZZONTE
            let horizonY = cy + phoneAlt * scale;
            if (horizonY < canvas.height + 300) {
                let grad = ctx.createLinearGradient(0, horizonY, 0, canvas.height);
                grad.addColorStop(0, "rgba(0, 40, 0, 0.6)");
                grad.addColorStop(1, "rgba(20, 0, 0, 0.95)");
                ctx.fillStyle = grad;
                ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);

                ctx.strokeStyle = "#00ff00";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, horizonY);
                ctx.lineTo(canvas.width, horizonY);
                ctx.stroke();

                ctx.fillStyle = "#ff3333";
                ctx.font = "bold 11px monospace";
                ctx.fillText("[ ORIZZONTE SUOLO 0° ]", 15, horizonY + 15);
            }

            // 2. Griglia Matrix
            ctx.strokeStyle = "#003300";
            ctx.lineWidth = 1;
            for (let a = 0; a <= 90; a += 15) {
                ctx.beginPath();
                ctx.arc(cx, cy, (90 - a) * scale, 0, 2 * Math.PI);
                ctx.stroke();
            }

            // 3. Coordinate Stelle
            const starCoordsCache = {};
            Object.keys(stars).forEach(sName => {
                let s = stars[sName];
                let coords = raDecToAltAz(s.ra, s.dec, lst);
                let dAz = coords.az - phoneAz;
                while (dAz > 180) dAz -= 360;
                while (dAz < -180) dAz += 360;

                let dAlt = coords.alt - phoneAlt;

                let x = cx + dAz * scale;
                let y = cy - dAlt * scale;

                starCoordsCache[sName] = { 
                    x: x, y: y, alt: coords.alt, mag: s.mag, 
                    ox: s.ox || 5, oy: s.oy || 3, isField: s.isField 
                };
            });

            // Disegna linee costellazioni
            ctx.strokeStyle = "#007700";
            ctx.lineWidth = 1.3;
            constellationLines.forEach(line => {
                let s1 = starCoordsCache[line[0]];
                let s2 = starCoordsCache[line[1]];
                if (s1 && s2 && s1.alt > -5 && s2.alt > -5) {
                    drawClippedLine(s1, s2);
                }
            });

            // Disegna Punti Stella e Nomi
            Object.keys(starCoordsCache).forEach(sName => {
                let s = starCoordsCache[sName];
                if (s.alt > -5 && s.x >= -50 && s.x <= canvas.width + 50 && s.y >= -50 && s.y <= canvas.height + 50) {
                    ctx.fillStyle = s.alt >= 0 ? "#00ff00" : "#880000";
                    ctx.beginPath();
                    let radius = s.isField ? Math.max(1, 3.0 - s.mag * 0.5) : Math.max(1.8, 4.5 - s.mag * 0.6);
                    ctx.arc(s.x, s.y, radius, 0, 2 * Math.PI);
                    ctx.fill();

                    if (!s.isField) {
                        ctx.font = "9px monospace";
                        ctx.fillText(sName, s.x + s.ox, s.y + s.oy);
                    }
                }
            });

            // 4. Cataloghi Estesi Messier + NGC
            rawCatalog.forEach(obj => {
                if (activeCategoryFilter !== 'ALL' && obj.type !== activeCategoryFilter) return;

                let coords = raDecToAltAz(obj.ra, obj.dec, lst);
                if (coords.alt > -5) {
                    let dAz = coords.az - phoneAz;
                    while (dAz > 180) dAz -= 360;
                    while (dAz < -180) dAz += 360;

                    let dAlt = coords.alt - phoneAlt;
                    let x = cx + dAz * scale;
                    let y = cy - dAlt * scale;

                    if (x < -50 || x > canvas.width + 50 || y < -50 || y > canvas.height + 50) return;

                    const isTarget = selectedTarget && selectedTarget.id === obj.id;

                    if (isTarget && isBlinkOn) {
                        ctx.strokeStyle = "#ff0000";
                        ctx.fillStyle = "#ff0000";
                        ctx.lineWidth = 2;
                        ctx.strokeRect(x - 12, y - 12, 24, 24);
                    } else {
                        ctx.strokeStyle = coords.alt >= 0 ? "#00ff00" : "#660000";
                        ctx.fillStyle = coords.alt >= 0 ? "#00ff00" : "#660000";
                        ctx.lineWidth = 1;
                        if (obj.type === "DSO") {
                            ctx.strokeRect(x - 5, y - 5, 10, 10);
                        } else if (obj.type === "Double") {
                            ctx.beginPath();
                            ctx.arc(x, y, 4, 0, 2 * Math.PI);
                            ctx.stroke();
                        } else {
                            ctx.beginPath();
                            ctx.arc(x, y, 5, 0, 2 * Math.PI);
                            ctx.fill();
                        }
                    }

                    let offY = (obj.id === "M32") ? 14 : 3;
                    ctx.font = "10px monospace";
                    ctx.fillText(obj.id, x + 7, y + offY);
                }
            });

            // 5. Reticolo Puntamento
            ctx.strokeStyle = "#00ff00";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(cx, cy, 25, 0, 2 * Math.PI);
            ctx.arc(cx, cy, 45, 0, 2 * Math.PI);
            ctx.moveTo(cx - 60, cy); ctx.lineTo(cx - 10, cy);
            ctx.moveTo(cx + 10, cy); ctx.lineTo(cx + 60, cy);
            ctx.moveTo(cx, cy - 60); ctx.lineTo(cx, cy - 10);
            ctx.moveTo(cx, cy + 10); ctx.lineTo(cx, cy + 60);
            ctx.stroke();

            // 6. Push-To Target & Freccia Rossa
            const bingo = document.getElementById("bingo-banner");
            if (selectedTarget) {
                let targetCoords = raDecToAltAz(selectedTarget.ra, selectedTarget.dec, lst);
                let dAlt = targetCoords.alt - phoneAlt;
                let dAz = targetCoords.az - phoneAz;
                while (dAz > 180) dAz -= 360;
                while (dAz < -180) dAz += 360;

                const tElem = document.getElementById("targetCoords");
                if (tElem) tElem.textContent = `${targetCoords.alt.toFixed(0)}°/${targetCoords.az.toFixed(0)}°`;
                const dElem = document.getElementById("deltaCoords");
                if (dElem) dElem.textContent = `${dAlt.toFixed(1)}°/${dAz.toFixed(1)}°`;

                let dist = Math.sqrt(dAlt * dAlt + dAz * dAz);
                if (dist <= 1.2) {
                    if (bingo) bingo.style.display = "block";
                    if (isBlinkOn) {
                        ctx.strokeStyle = "#ff0000";
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(cx, cy, 30, 0, 2 * Math.PI);
                        ctx.stroke();
                    }
                } else {
                    if (bingo) bingo.style.display = "none";
                    let angle = Math.atan2((targetCoords.alt - phoneAlt), dAz);
                    let ax = cx + Math.cos(angle) * 80;
                    let ay = cy - Math.sin(angle) * 80;

                    if (isBlinkOn) {
                        ctx.save();
                        ctx.translate(ax, ay);
                        ctx.rotate(-angle);
                        ctx.fillStyle = "#ff0000";
                        ctx.strokeStyle = "#ffffff";
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(18, 0); ctx.lineTo(-10, -10); ctx.lineTo(-4, 0); ctx.lineTo(-10, 10);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                        ctx.restore();
                    }
                }
            } else {
                if (bingo) bingo.style.display = "none";
            }
        }

        function animate() {
            drawSky();
            requestAnimationFrame(animate);
        }

        function updateTonightDropdown() {
            const select = document.getElementById("tonightSelect");
            if (!select) return;
            const lst = getLST();
            let visible = [];

            rawCatalog.forEach((item, idx) => {
                let coords = raDecToAltAz(item.ra, item.dec, lst);
                if (coords.alt >= 5) visible.push({ index: idx, obj: item, alt: coords.alt });
            });

            visible.sort((a, b) => b.alt - a.alt);
            select.innerHTML = '<option value="">★ OSSERVABILI STASERA...</option>';
            visible.forEach(v => {
                let opt = document.createElement("option");
                opt.value = v.index;
                opt.textContent = `[Alt: ${v.alt.toFixed(0)}°] ${v.obj.id} - ${v.obj.name}`;
                select.appendChild(opt);
            });
        }

        function onSelectTonight() {
            const val = document.getElementById("tonightSelect").value;
            if (val !== "") {
                selectedTarget = rawCatalog[val];
                const tSel = document.getElementById("targetSelect");
                if (tSel) tSel.value = val;
            }
        }

        function populateSelect() {
            const select = document.getElementById("targetSelect");
            if (!select) return;
            const query = (document.getElementById("searchInput")?.value || "").toLowerCase();
            select.innerHTML = '<option value="">-- Catalogo Completo --</option>';

            rawCatalog.forEach((item, idx) => {
                if (activeCategoryFilter !== 'ALL' && item.type !== activeCategoryFilter) return;
                if (query && !item.id.toLowerCase().includes(query) && !item.name.toLowerCase().includes(query)) return;
                let opt = document.createElement("option");
                opt.value = idx;
                opt.textContent = `[${item.type}] ${item.id} - ${item.name}`;
                select.appendChild(opt);
            });
        }

        function filterCatalog() { populateSelect(); }

        function setFilter(type, btn) {
            activeCategoryFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            populateSelect();
        }

        function onSelectTarget() {
            const val = document.getElementById("targetSelect").value;
            selectedTarget = val === "" ? null : rawCatalog[val];
        }

        function resizeCanvas() {
            canvas = document.getElementById("skyCanvas");
            if (!canvas) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx = canvas.getContext("2d");
        }

        function requestSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => {
                    if (res === 'granted') window.addEventListener('deviceorientation', handleOrientation);
                });
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        function handleOrientation(e) {
            if (e.alpha !== null && e.beta !== null) {
                phoneAz = (360 - e.alpha) % 360;
                phoneAlt = e.beta;
            }
        }

        window.onload = function() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            let isDragging = false, startX, startY;

            window.addEventListener('touchstart', e => {
                if (e.target.tagName === 'CANVAS') {
                    isDragging = true;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                }
            });

            window.addEventListener('touchmove', e => {
                if (!isDragging) return;
                let dx = e.touches[0].clientX - startX;
                let dy = e.touches[0].clientY - startY;
                phoneAz = (phoneAz + dx * 0.2 + 360) % 360;
                phoneAlt = Math.max(-10, Math.min(90, phoneAlt + dy * 0.2));
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });

            window.addEventListener('touchend', () => isDragging = false);

            window.addEventListener('mousedown', e => {
                if (e.target.tagName === 'CANVAS') {
                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                }
            });

            window.addEventListener('mousemove', e => {
                if (!isDragging) return;
                let dx = e.clientX - startX;
                let dy = e.clientY - startY;
                phoneAz = (phoneAz + dx * 0.2 + 360) % 360;
                phoneAlt = Math.max(-10, Math.min(90, phoneAlt + dy * 0.2));
                startX = e.clientX;
                startY = e.clientY;
            });

            window.addEventListener('mouseup', () => isDragging = false);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userLat = pos.coords.latitude;
                    userLon = pos.coords.longitude;
                    updateMoonInfo();
                    updateTonightDropdown();
                });
            }

            updateMoonInfo();
            populateSelect();
            updateTonightDropdown();
            animate();
        };
    </script>
</body>
</html>
